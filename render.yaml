# Render Blueprint — creates the database and the web app in one go.
# Render dashboard → New → Blueprint → pick this GitHub repo.
databases:
  - name: project-explorer-db
    databaseName: explorer
    user: explorer
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: project-explorer
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm --prefix server ci && npm --prefix client ci --include=dev && npm --prefix client run build
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_ON_EMPTY
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: project-explorer-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false          # you paste this in when the blueprint asks
      - key: ALLOWED_GOOGLE_DOMAIN
        value: propertypistol.com
      - key: BOOTSTRAP_ADMIN_EMAILS
        value: hemant.bajaj@propertypistol.com
