# Local / single-server deployment: PostgreSQL + the app.
#   cp .env.example .env   (fill in GOOGLE_CLIENT_ID etc.)
#   docker compose up -d --build
#   docker compose exec app npm run seed      # optional: reference data + sample projects (empty DB only)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: explorer
      POSTGRES_USER: explorer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U explorer"], interval: 5s, retries: 10 }
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://explorer:${POSTGRES_PASSWORD:-change-me}@db:5432/explorer
    ports: ["4000:4000"]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
volumes:
  pgdata:
